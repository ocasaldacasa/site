  th.forEach(t=>t.onclick=()=>ir(+t.dataset.i));
  sl.querySelectorAll('img').forEach(im=>im.onclick=()=>abre(fotos.map(n=>IMG(e,n)),+im.dataset.i));
  document.querySelectorAll('[data-pl]').forEach((im,i)=>im.onclick=()=>abre(pl.map(n=>IMG(e,n)),i));
}
